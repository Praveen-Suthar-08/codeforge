services:
  # 1. NGINX Reverse Proxy & Load Balancer
  nginx:
    image: nginx:alpine
    container_name: codeforge_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./client/dist:/usr/share/nginx/html:ro
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - codeforge-net

  # 2. Node.js Production Express Backend
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: codeforge_server
    environment:
      - PORT=4000
      - NODE_ENV=production
      - JWT_ACCESS_SECRET=codeforge-access-production-secret-2026
      - JWT_REFRESH_SECRET=codeforge-refresh-production-secret-2026
      - CLIENT_URL=http://localhost
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - codeforge-net

  # 3. Optional Piston Code Execution Sandbox
  piston:
    image: ghcr.io/engineer-man/piston
    container_name: codeforge_piston
    ports:
      - "2000:2000"
    privileged: true
    tmpfs:
      - /piston/jobs:exec,uid=1000,gid=1000,mode=711
    restart: unless-stopped
    networks:
      - codeforge-net

networks:
  codeforge-net:
    driver: bridge
